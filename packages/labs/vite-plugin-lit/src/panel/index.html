<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lit Timeline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 13px;
        background: #1a1a1f;
        color: #d4d4d8;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid #2d2d35;
        background: #16161b;
      }
      .logo {
        color: #4fc08d;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .phase-badge {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 10px;
        background: #2d2d35;
        color: #a0a0b0;
      }
      .record-btn {
        margin-left: auto;
        padding: 4px 10px;
        border-radius: 4px;
        border: 1px solid #2d2d35;
        background: #2d2d35;
        color: #d4d4d8;
        font-size: 11px;
        cursor: pointer;
      }
      .record-btn.active {
        border-color: #ef4444;
        background: #7f1d1d;
        color: #fca5a5;
      }
      .layers {
        display: flex;
        gap: 4px;
        padding: 6px 12px;
        border-bottom: 1px solid #2d2d35;
        background: #18181e;
        flex-shrink: 0;
      }
      .layer-pill {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border-radius: 10px;
        background: #2d2d35;
        font-size: 11px;
        cursor: pointer;
        user-select: none;
      }
      .layer-pill .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .event-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }
      .event-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 4px 12px;
        font-size: 11px;
        font-family: ui-monospace, monospace;
        border-bottom: 1px solid #1e1e26;
        animation: fadeIn 0.15s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-2px);
        }
      }
      .event-row .time {
        color: #666;
        flex-shrink: 0;
        width: 56px;
        text-align: right;
      }
      .event-row .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .event-row .title {
        flex: 1;
        color: #d4d4d8;
      }
      .event-row .subtitle {
        color: #666;
        flex-shrink: 0;
      }
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 8px;
        color: #555;
        font-size: 12px;
      }
      .empty .hint {
        font-size: 11px;
        color: #444;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="logo">Lit Timeline</span>
      <span class="phase-badge">Phase 0 — spike</span>
      <button class="record-btn" id="recordBtn">&#9654; Record</button>
    </header>
    <div class="layers" id="layers"></div>
    <div class="event-list" id="eventList">
      <div class="empty">
        <span>No events recorded.</span>
        <span class="hint">Press Record then interact with the page.</span>
      </div>
    </div>

    <script>
      const LAYERS = [
        {id: 'lit-lifecycle', label: 'Lit Lifecycle', color: '#4fc08d'},
        {id: 'lit-render', label: 'Lit Render', color: '#325cff'},
        {id: 'mouse', label: 'Mouse', color: '#a451af'},
        {id: 'keyboard', label: 'Keyboard', color: '#8151af'},
      ];

      let recording = false;

      // Render layer pills
      const layersEl = document.getElementById('layers');
      for (const layer of LAYERS) {
        const pill = document.createElement('div');
        pill.className = 'layer-pill';
        pill.dataset.layerId = layer.id;
        pill.innerHTML = `<span class="dot" style="background:${layer.color}"></span>${layer.label}`;
        layersEl.appendChild(pill);
      }

      // Record toggle — sends recording state to the app via Vite HMR channel.
      // The panel iframe shares origin with the dev server so postMessage to
      // window.parent reaches the devtools shell; the server relays via HMR.
      const recordBtn = document.getElementById('recordBtn');
      recordBtn.addEventListener('click', () => {
        recording = !recording;
        recordBtn.textContent = recording ? '⏹ Stop' : '▶ Record';
        recordBtn.classList.toggle('active', recording);
        // Ask the server to broadcast the recording state change to the app.
        window.parent.postMessage(
          {type: '__lit_timeline_set_recording', recording},
          '*'
        );
      });

      // Subscribe to the SSE event stream pushed by the server.
      // The server relays batches it receives from the app via Vite HMR.
      const es = new EventSource('/__lit-timeline-events');
      es.onmessage = (e) => {
        if (!recording) return;
        let batch;
        try {
          batch = JSON.parse(e.data);
        } catch {
          return;
        }
        if (!Array.isArray(batch)) return;
        for (const ev of batch) addEvent(ev);
      };
      es.onerror = () => {
        document.getElementById('status')?.setAttribute('data-error', 'true');
      };

      function addEvent(ev) {
        renderEvent(ev);
      }

      function renderEvent(ev) {
        const layer = LAYERS.find((l) => l.id === ev.layerId);
        const list = document.getElementById('eventList');
        list.querySelector('.empty')?.remove();

        const row = document.createElement('div');
        row.className = 'event-row';
        // Sanitise title/subtitle to avoid XSS from event data
        const title = String(ev.title ?? ev.layerId).replace(
          /[<>&"]/g,
          (c) => ({'<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;'})[c]
        );
        const subtitle = String(ev.subtitle ?? '').replace(
          /[<>&"]/g,
          (c) => ({'<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;'})[c]
        );
        row.innerHTML = `
          <span class="time">${Number(ev.time).toFixed(1)}ms</span>
          <span class="dot" style="background:${layer?.color ?? '#888'}"></span>
          <span class="title">${title}</span>
          <span class="subtitle">${subtitle}</span>
        `;
        list.appendChild(row);
        list.scrollTop = list.scrollHeight;
      }
    </script>
  </body>
</html>
