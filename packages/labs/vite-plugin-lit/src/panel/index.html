<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lit DevTools</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        height: 100vh;
        overflow: hidden;
      }
    </style>
    <!--
      Apply the saved panel theme class as early as possible to avoid a flash.
      The matching theme tokens are injected by timeline-app.ts on load.
    -->
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('lit-devtools-theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.classList.add('theme-' + theme);
          }
        } catch {
          // ignore
        }
      })();
    </script>
  </head>
  <body>
    <timeline-app></timeline-app>
  </body>
</html>
