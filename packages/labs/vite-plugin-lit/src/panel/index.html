<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lit DevTools</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        height: 100vh;
        overflow: hidden;
      }
    </style>
    <!--
      Apply the panel theme class as early as possible to avoid a flash.
      Respects the saved preference; defaults to the system color scheme.
      The matching theme tokens are injected by timeline-app.ts on load.
    -->
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('lit-devtools-theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.classList.add('theme-' + theme);
          } else {
            // No saved preference — follow the system color scheme.
            const prefersDark = window.matchMedia(
              '(prefers-color-scheme: dark)'
            ).matches;
            document.documentElement.classList.add(
              prefersDark ? 'theme-dark' : 'theme-light'
            );
          }
        } catch {
          // ignore
        }
      })();
    </script>
  </head>
  <body>
    <timeline-app></timeline-app>
  </body>
</html>
