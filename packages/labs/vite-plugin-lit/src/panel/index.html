<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lit DevTools</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        height: 100vh;
        overflow: hidden;
      }
    </style>
    <!--
      The anti-FOUC theme bootstrap script is injected into <head> at serve
      time by timeline-plugin.ts (generated from lib/theme.ts, so the storage
      key stays single-sourced). It resolves the saved preference — defaulting
      to the system color scheme — before paint; lit-devtools-panel.ts then owns the
      theme at runtime and follows OS changes live while in `auto`.
    -->
  </head>
  <body>
    <lit-devtools-panel></lit-devtools-panel>
  </body>
</html>
