<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Inline so a top-level visit never asks for /favicon.ico (the dock embeds
      the panel in an iframe, which never does). The Lit flame, as in
      docs/src/assets/lit-flame.svg.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 200'><path fill='%2300e8ff' d='M40 120l20-60l90 90l-30 50l-40-40h-20'/><path fill='%23283198' d='M80 160v-80l40-40v80M0 160l40 40l20-40l-20-40h-20'/><path fill='%23324fff' d='M40 120v-80l40-40v80M120 200v-80l40-40v80M0 160v-80l40 40'/><path fill='%2300ffff' d='M40 200v-80l40 40'/></svg>"
    />
    <title>Lit DevTools</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        height: 100vh;
        overflow: hidden;
      }
    </style>
    <!--
      Color scheme: lit-devtools-panel.ts applies the saved preference on load
      (see lib/color-scheme.ts). The default `auto` needs no JS — the injected
      tokens'
      `prefers-color-scheme` @media owns it, following the host/OS; an explicit
      light/dark pins a `.color-scheme-*` class on :root.
    -->
  </head>
  <body>
    <lit-devtools-panel></lit-devtools-panel>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
