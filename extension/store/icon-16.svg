<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- extension/public/icon.svg redrawn on the 16px pixel grid, where its
       rounded nodes and thin connectors would blur into one shape. -->
  <rect width="16" height="16" rx="3.5" fill="#324fff" shape-rendering="auto"/>
  <rect x="2" y="3" width="7" height="3" fill="#fff"/>
  <rect x="4" y="6" width="2" height="8" fill="#fff"/>
  <rect x="6" y="8" width="7" height="2" fill="#fff"/>
  <rect x="6" y="12" width="1" height="2" fill="#fff"/>
  <rect x="7" y="12" width="7" height="2" fill="#00e8ff"/>
</svg>
