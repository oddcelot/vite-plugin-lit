name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `vp check` type checks the playground and the docs site, which import
      # the plugin's own build output and Astro's generated `astro:content`
      # types. Both are gitignored, so generate them before checking.
      - run: pnpm run build
      - run: pnpm --filter ./docs run sync
      - run: pnpm --filter ./docs exec astro sync
      - run: pnpm exec vp check
      - run: pnpm run test:unit
      # Catches a jsr.json that no longer matches the build before a tag does.
      - run: pnpm dlx jsr@0.14.3 publish --dry-run --set-version "$(node -p "require('./package.json').version")"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e
