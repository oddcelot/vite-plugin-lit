name: Secrets

# Scans the whole git history for leaked credentials with betterleaks, the
# Gitleaks successor. The full history is small enough to scan in well under a
# second, so there is no per-PR commit range to get wrong: a secret committed
# and then deleted in a later commit still fails the run.
#
# There is no official betterleaks action, so this installs the release binary
# and checks it against a sha256 pinned here rather than the release's own
# checksums.txt. Bumping the version means updating both lines.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETTERLEAKS_VERSION: 1.8.1
      BETTERLEAKS_SHA256: efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install betterleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" betterleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # `--redact` keeps any secret it finds out of the public job log.
      - run: betterleaks git . --no-banner --redact --verbose
