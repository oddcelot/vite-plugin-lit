name: Store access

# Checks that the release's `chrome-web-store` job could reach the Chrome Web
# Store, without uploading anything: the same keyless Google sign-in, then a
# read-only `fetchStatus` of the item. Run it after changing the Workload
# Identity setup, the service account or the store secrets:
#
#   gh workflow run store-access.yaml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-web-store:
    runs-on: ubuntu-latest
    environment: stores
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.CWS_WIF_PROVIDER }}
          service_account: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 300s
          create_credentials_file: false
      - name: Read the item's status
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: node scripts/cws-publish.mjs --check
