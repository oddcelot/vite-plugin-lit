        { name: "Components", c: "#6b7bff" },

        [38.55, 42.19, 4, "lit_range-summary"],

      var tabEls = TABS.map(function (name, i) {
        var d = document.createElement("div");

      });

        laneLines.push(ln);

        lab.style.top = (700 + 70 * i) + "px";

        laneChars.push(lab.querySelectorAll(".chrome-ltxt span"));
        laneGlow.push(lab.querySelector(".chrome-sw b"));
        laneTxt.push(lab.querySelector(".chrome-ltxt"));

      // ---------- ambient marks ----------

      LANES.forEach(function (L, i) {
        for (var n = 0; ; n++) {

          m.style.setProperty("--t", t.toFixed(3));

      }

        G($("chrome-rulerwrap"), { clipPath: "inset(0px 1880px 0px 40px)" }, { clipPath: "inset(0px 40px 0px 40px)", duration: 0.3, ease: "power2.inOut" }, 0.6);

        G(laneLabs, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", stagger: 0.08 }, 0.7);

        F($("chrome-btn-rec"), { opacity: 0 }, { opacity: 1, duration: 0.12 }, 52.2);

          F(m.el, { opacity: 0 }, { opacity: 0.75, duration: 0.06 }, m.tg);
        });

          F(b.ol, { opacity: 1 }, { opacity: 0, duration: 0.15 }, ta);
          F(b.lw, { color: b.c }, { color: "#ffffff", duration: 0.15 }, ta);
