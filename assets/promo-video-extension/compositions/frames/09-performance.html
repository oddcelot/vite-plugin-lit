          ids.forEach(function (id, k) {
            tl.fromTo("#s09-" + id, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.28, ease: "power2.out" }, t + k * step);

        tl.set("#s09-lab-on", { opacity: 1 }, 0.76);
        tl.fromTo("#s09-c3", { borderColor: "#363636" }, { borderColor: "#4d63ff", duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, 0.76);
        tl.to("#s09-cur", { x: 1040, y: 790, duration: 0.3, ease: "power2.inOut" }, 0.9);
        tl.to("#s09-cur", { opacity: 0, duration: 0.1 }, 1.1);

        // Performance panel takes over at 1.20
        tl.set("#s09-set", { opacity: 0 }, 1.2);
        tl.set("#s09-perf", { opacity: 1 }, 1.2);
        grow(["m1", "m3", "m4", "m6", "m8", "m7", "m2", "m5"], 1.44, 0.04);
