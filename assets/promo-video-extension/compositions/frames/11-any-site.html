    (function () {
      var trees = {
        s11_t0: [[0,"fh-app",2],[1,"fh-header",2],[2,"fh-search",0],[2,"fh-cart-button",0],[1,"fh-product-card",1],[1,"fh-product-card",2],[2,"fh-reviews",0],[1,"fh-product-card",1],[1,"fh-newsletter",1],[1,"fh-footer",0]],

      };
      var map = { "s11-t0": trees.s11_t0, "s11-t1": trees.s11_t1, "s11-t2": trees.s11_t2, "s11-t3": trees.s11_t0 };
      Object.keys(map).forEach(function (id) {
        var h = "";
        map[id].forEach(function (r, i) {
          var x = 14 + r[0] * 20;
          var chev = r[2] === 1 ? '<svg style="left:' + (x - 4) + 'px" viewBox="0 0 10 10"><path d="M3 1.5L7 5L3 8.5" fill="none" stroke="#919191" stroke-width="1.3"/></svg>' : r[2] === 2 ? '<svg style="left:' + (x - 4) + 'px" viewBox="0 0 10 10"><path d="M1.5 3L5 7L8.5 3" fill="none" stroke="#919191" stroke-width="1.3"/></svg>' : "";
          h += '<div class="s11-row" style="top:' + (8 + i * 27) + 'px;padding-left:' + (x + 14) + 'px">' + chev + '<em>&lt;</em>' + r[1] + '<em>&gt;</em></div>';
        });
        document.getElementById(id).innerHTML = h;
      });

      var tl = gsap.timeline({ paused: true });
      var slam = function (sel, t) { tl.fromTo(sel, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" }, t); };
      tl.fromTo("#s11-eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0);
      slam("#s11-capA", 0.10);
      slam("#s11-capB", 0.96);
      tl.fromTo("#s11-sub", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 1.92);

      // trees: tN visible from its time; rows waterfall in
      var show = function (id, t, hideId, wf) {
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.001 }, t);
        if (hideId) tl.to(hideId, { opacity: 0, duration: 0.001 }, t);
        if (wf) tl.fromTo(id + " .s11-row", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.22, ease: "power2.out", stagger: 0.04 }, t);
      };
      tl.fromTo("#s11-t0", { opacity: 0.4 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0);
      tl.to("#s11-t0", { opacity: 0, duration: 0.001 }, 0.96);
      show("#s11-t1", 0.96, null, true);
      show("#s11-t2", 1.92, "#s11-t1", true);
      show("#s11-t3", 2.88, "#s11-t2", true);

      // page covers
      tl.fromTo("#s11-cov-atlas", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0.96);
      tl.fromTo("#s11-cov-tickets", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 1.92);
      tl.to(["#s11-cov-atlas", "#s11-cov-tickets"], { opacity: 0, duration: 0.12, ease: "power1.in" }, 2.88);
      tl.fromTo("#s11-cov-atlas .card", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.06 }, 1.0);
      tl.fromTo("#s11-cov-tickets .ev", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.06 }, 1.96);
      window.__timelines["s11-any-site"] = tl;
    })();
