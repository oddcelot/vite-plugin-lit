<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #030308;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-record"
        class="scene"
        data-composition-id="01-record"
        data-composition-src="compositions/frames/01-record.html"
        data-start="0"
        data-duration="2"
        data-track-index="1"
      ></div>

      <div
        id="el-02-hmr"
        class="scene"
        data-composition-id="02-hmr"
        data-composition-src="compositions/frames/02-hmr.html"
        data-start="2"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-css-sheet"
        class="scene"
        data-composition-id="03-css-sheet"
        data-composition-src="compositions/frames/03-css-sheet.html"
        data-start="6"
        data-duration="3.5"
        data-track-index="1"
      ></div>

      <div
        id="el-04-inspector"
        class="scene"
        data-composition-id="04-inspector"
        data-composition-src="compositions/frames/04-inspector.html"
        data-start="9.5"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-05-source"
        class="scene"
        data-composition-id="05-source"
        data-composition-src="compositions/frames/05-source.html"
        data-start="12.5"
        data-duration="2"
        data-track-index="1"
      ></div>

      <div
        id="el-06-mcp"
        class="scene"
        data-composition-id="06-mcp"
        data-composition-src="compositions/frames/06-mcp.html"
        data-start="14.5"
        data-duration="2.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-lockup"
        class="scene"
        data-composition-id="07-lockup"
        data-composition-src="compositions/frames/07-lockup.html"
        data-start="17"
        data-duration="3"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/brisk-feature-reveal.m4a"
        data-start="0"
        data-duration="20"
        data-track-index="11"
        data-volume="0.9"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
