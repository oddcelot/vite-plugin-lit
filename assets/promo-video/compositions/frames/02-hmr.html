  <script>
  (function(){
    var tl = gsap.timeline({ paused: true });

    // Playhead: linear 72 px/s, tg 2 -> 6
    tl.fromTo("#f02-ph", { x: 0 }, { x: 288, duration: 4, ease: "none" }, 0);

    // HMR bar: future -> active at 0.2 (playhead hits t0) -> past at 3.8 (t1 = tg 5.8)
    tl.set("#f02-fut", { opacity: 0 }, 0.2);
    tl.set("#f02-act", { opacity: 1 }, 0.2);
    tl.fromTo("#f02-prog", { scaleX: 0 }, { scaleX: 1, duration: 3.6, ease: "none" }, 0.2);
    tl.set("#f02-act", { opacity: 0 }, 3.8);
    tl.set("#f02-past", { opacity: 0.7 }, 3.8);
    tl.set("#f02-lab0", { color: "#ffffff" }, 0.2);
    tl.set("#f02-dot0", { backgroundColor: "#00e8ff" }, 0.2);
    tl.set("#f02-lab0", { color: "#a1a1a1" }, 3.8);
    tl.set("#f02-dot0", { backgroundColor: "#4d63ff" }, 3.8);

    // Connector grows bar -> stage, retracts with the stage snap
    tl.fromTo("#f02-conn", { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "power2.out" }, 0.2);
    tl.to("#f02-conn", { scaleY: 0, duration: 0.2, ease: "power3.in" }, 3.65);

    // Scene 1: eyebrow
    tl.fromTo("#f02-eyebrow", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.3);

    // Scene 2: cards spring in; glow blooms with them (driver below)
    tl.fromTo("#f02-comp", { opacity: 0, scale: 0.92, y: 24, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.4)" }, 0.36);
    tl.fromTo("#f02-code", { opacity: 0, scale: 0.94, y: 28, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.4)" }, 0.5);

    // Kinetic beat slams: distinct entrance per line
    tl.fromTo("#f02-hl1", { scale: 1.5, filter: "blur(16px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" }, 0.9);
    tl.fromTo("#f02-hl2", { x: -320, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 2.0);
    tl.fromTo("#f02-hl3", { y: 90, rotation: 6, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "circ.out" }, 2.8);

    // Scene 4: save at 2.4 - code border pulse, chip pop, card flash + bump, title swap, ring, renders
    tl.to("#f02-code", { borderColor: "#4d63ff", duration: 0.08, ease: "none" }, 2.4);
    tl.to("#f02-code", { borderColor: "#363636", duration: 0.6, ease: "power2.out" }, 2.5);
    tl.fromTo("#f02-chip", { opacity: 0, scale: 0.5, y: 8, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, y: 0, duration: 0.28, ease: "back.out(2.2)" }, 2.4);
    tl.set("#f02-flash", { opacity: 1 }, 2.4);
    tl.to("#f02-flash", { opacity: 0, duration: 0.75, ease: "power2.out" }, 2.48);
    tl.to("#f02-comp", { scale: 1.018, duration: 0.1, ease: "power1.in" }, 2.4);
    tl.to("#f02-comp", { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 2.5);
    tl.set("#f02-t1", { opacity: 0 }, 2.4);
    tl.fromTo("#f02-t2", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, 2.4);
    tl.set("#f02-ring", { opacity: 0.9, scale: 1 }, 2.4);
    tl.to("#f02-ring", { opacity: 0, scale: 1.45, duration: 0.6, ease: "power2.out" }, 2.4);
    tl.set("#f02-r1", { opacity: 0 }, 2.4);
    tl.set("#f02-r2", { opacity: 1 }, 2.4);

    // Scene 5: stage snaps shut toward the ruler (y 620) by 3.85
    tl.to("#f02-bloom", { scaleY: 0, duration: 0.2, ease: "power3.in" }, 3.65);

    // Driver: deterministic functions of time (glow breathe, typed code text, caret)
    var glow = document.getElementById("f02-glow");
    var codeH = document.getElementById("f02-codeh");
    var caret = document.getElementById("f02-caret");
    var APPEND = ": edited live";
    var KEYS = [1.50, 1.56, 1.72, 1.78, 1.84, 1.90, 1.95, 2.01, 2.10, 2.16, 2.21, 2.26, 2.31];
    var PEAK = 0.3;
    function render(t) {
      var op, sc;
      if (t < 0.36) { op = 0; sc = 0.85; }
      else if (t < 1.0) {
        var p = (t - 0.36) / 0.64, e = 1 - (1 - p) * (1 - p);
        op = PEAK * e; sc = 0.85 + 0.15 * e;
      } else {
        var s = Math.sin(Math.PI * 2 * (t - 1.0) / 3);
        op = PEAK + 0.03 * s; sc = 1 + 0.02 * s;
      }
      glow.style.opacity = String(op);
      glow.style.transform = "scale(" + sc + ")";
      var n = 0, last = 1.4;
      for (var i = 0; i < KEYS.length; i++) { if (t >= KEYS[i]) { n = i + 1; last = KEYS[i]; } }
      codeH.textContent = "Counter" + APPEND.slice(0, n);
      var c = 0;
      if (t >= 1.4 && t < 2.42) c = (t - last < 0.3) ? 1 : (Math.floor((t - 1.4) / 0.27) % 2 === 0 ? 1 : 0);
      caret.style.opacity = String(c);
    }
    var drv = { t: 0 };
    render(0);
    tl.to(drv, { t: 4, duration: 4, ease: "none", onUpdate: function () { render(drv.t); } }, 0);

    window.__timelines = window.__timelines || {};
    window.__timelines["02-hmr"] = tl;
  })();
