  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var F = 1 / 60;
      var E = "power4.out";
      function whip(sel, at, y, d) {
        tl.set(sel, { opacity: 1, y: y }, at);
        tl.to(sel, { y: 0, duration: d, ease: E }, at);
      }

      /* Playhead: linear 72px/s, x(tg) = 360 + 72*tg, tg = 9.5 + t */
      tl.fromTo("#i4-ph", { x: 1044 }, { x: 1260, duration: 3, ease: "none" }, 0);

      /* Inspector bar: future -> active (0.2) -> past (2.8); left part brightens with playhead */
      tl.set("#i4-bar2", { backgroundColor: "#4d63ff", borderColor: "#4d63ff", opacity: 1, boxShadow: "0 0 18px rgba(77,99,255,0.8)" }, 0.2);
      tl.set("#i4-fill", { opacity: 1 }, 0.2);
      tl.fromTo("#i4-fill", { scaleX: 0 }, { scaleX: 1, duration: 2.6, ease: "none" }, 0.2);
      tl.set("#i4-fill", { opacity: 0 }, 2.8);
      tl.set("#i4-bar2", { backgroundColor: "rgba(50,79,255,0.7)", borderColor: "rgba(50,79,255,0.7)", boxShadow: "0 0 0 rgba(77,99,255,0)" }, 2.8);
      tl.set("#i4-lt2", { color: "#ffffff" }, 0.2);
      tl.set("#i4-dot2", { backgroundColor: "#00e8ff" }, 0.2);
      tl.set("#i4-lt2", { color: "#a1a1a1" }, 2.8);
      tl.set("#i4-dot2", { backgroundColor: "#4d63ff" }, 2.8);

      /* Connector grows from the bar to the stage */
      tl.fromTo("#i4-conn", { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "power2.out" }, 0.2);

      /* Scene 1: eyebrow + waterfall headline */
      whip("#i4-eyebrow", 0.3, 30, 0.14);
      var t = 0.4;
      whip("#i4-w1", t, 60, 0.16);
      t = t + 0.16 - F;
      whip("#i4-w2", t, 50, 0.16);
      whip("#i4-w3", 0.9, 80, 0.2);

      /* Scene 2: inspector panel + tree waterfall */
      whip("#i4-panel", 0.5, 40, 0.22);
      var rows = [0.62, 0.74, 0.85, 0.95, 1.04, 1.12];
      for (var i = 0; i < rows.length; i++) whip("#i4-tr" + i, rows[i], 40, 0.15);
      tl.fromTo("#i4-sel", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, 1.2);

      /* Scene 3: right pane fills, lifecycle streams in */
      whip("#i4-ph2", 1.6, 30, 0.16);
      whip("#i4-s1", 1.72, 30, 0.14);
      whip("#i4-s2", 1.86, 30, 0.14);
      whip("#i4-s3", 2.0, 30, 0.14);
      tl.set("#i4-lch", { opacity: 1 }, 2.05);
      whip("#i4-e1", 2.15, 24, 0.12);
      whip("#i4-e2", 2.3, 24, 0.12);
      whip("#i4-e3", 2.45, 24, 0.12);

      /* Control-target sync: one state array drives the readouts, the events pulse them */
      var STEPS = [
        { t: 0, count: "41", renders: "1" },
        { t: 2.15, count: "42", renders: "1" },
        { t: 2.3, count: "42", renders: "2" }
      ];
      function stepAt(time) {
        for (var k = STEPS.length - 1; k >= 0; k--) if (time >= STEPS[k].t) return STEPS[k];
        return STEPS[0];
      }
      var cEl = document.getElementById("i4-count");
      var rEl = document.getElementById("i4-renders");
      var drv = { t: 0 };
      var last = null;
      tl.to(drv, {
        t: 3, duration: 3, ease: "none",
        onUpdate: function () {
          var s = stepAt(drv.t);
          if (s !== last) { cEl.textContent = s.count; rEl.textContent = s.renders; last = s; }
        }
      }, 0);
      tl.fromTo("#i4-count", { scale: 1.3 }, { scale: 1, duration: 0.22, ease: "power2.out" }, 2.15);
      tl.fromTo("#i4-renders", { scale: 1.3 }, { scale: 1, duration: 0.22, ease: "power2.out" }, 2.3);

      /* Scene 4: hold, then snap shut by 2.85 */
      tl.to("#i4-stage", { scaleY: 0, duration: 0.2, ease: "power3.in" }, 2.65);
      tl.to("#i4-conn", { scaleY: 0, duration: 0.15, ease: "power3.in" }, 2.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-inspector"] = tl;
    })();
  </script>
