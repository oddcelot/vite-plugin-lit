    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["06-mcp"] = tl;
        var $ = function (id) { return document.getElementById(id); };
        var F = 1 / 60;

        // Playhead: x(tg) = 360 + 72 tg, tg = 14.5 + t  ->  1404 + 72 t (line centered: -1)
        tl.fromTo("#m-ph", { x: 1403 }, { x: 1583, duration: 2.5, ease: "none" }, 0);

        // MCP bar / label become active at 0.2, past at 2.3
        tl.set("#m-mcpbar", { backgroundColor: "#4d63ff", borderColor: "#4d63ff", opacity: 1, boxShadow: "0 0 20px rgba(77,99,255,0.7)" }, 0.2);
        tl.fromTo("#m-fill", { width: 0 }, { width: 152.7, duration: 2.1, ease: "none" }, 0.2);
        tl.set("#m-mcpbar", { backgroundColor: "#324fff", borderColor: "#324fff", opacity: 0.7, boxShadow: "0 0 0 rgba(77,99,255,0)" }, 2.3);
        tl.set("#m-fill", { opacity: 0 }, 2.3);
        tl.set("#m-rl4", { color: "#ffffff" }, 0.2);
        tl.set("#m-dot4", { backgroundColor: "#00e8ff" }, 0.2);
        tl.set("#m-rl4", { color: "#a1a1a1" }, 2.3);
        tl.set("#m-dot4", { backgroundColor: "#4d63ff" }, 2.3);

        // Connector grows from the bar up to the stage
        tl.fromTo("#m-conn", { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "power2.out" }, 0.2);

        // Scene 1: eyebrow + headline waterfall
        tl.set("#m-eb", { opacity: 1, y: 30 }, 0.25);
        tl.to("#m-eb", { y: 0, duration: 0.12, ease: "power4.out" }, 0.25);
        tl.set("#m-h1", { opacity: 1, y: 60 }, 0.3);
        tl.to("#m-h1", { y: 0, duration: 0.18, ease: "power4.out" }, 0.3);
        tl.set("#m-h2", { opacity: 1, y: 70 }, 0.8);
        tl.to("#m-h2", { y: 0, duration: 0.2, ease: "power4.out" }, 0.8);

        // Scene 2: terminal card
        tl.set("#m-card", { opacity: 1, y: 40 }, 0.4);
        tl.to("#m-card", { y: 0, duration: 0.2, ease: "power4.out" }, 0.4);
        tl.set("#m-r2", { opacity: 1, y: 14 }, 1.0);
        tl.to("#m-r2", { y: 0, duration: 0.12, ease: "power4.out" }, 1.0);

        // Scene 3: result tree waterfall, then second command
        tl.set("#m-tr1", { opacity: 1, y: 40 }, 1.4);
        tl.to("#m-tr1", { y: 0, duration: 0.16, ease: "power4.out" }, 1.4);
        tl.set("#m-tr2", { opacity: 1, y: 34 }, 1.4 + 0.16 - F);
        tl.to("#m-tr2", { y: 0, duration: 0.14, ease: "power4.out" }, 1.4 + 0.16 - F);
        tl.set("#m-tr3", { opacity: 1, y: 30 }, 1.4 + 0.16 - F + 0.14 - 2 * F);
        tl.to("#m-tr3", { y: 0, duration: 0.12, ease: "power4.out" }, 1.4 + 0.16 - F + 0.14 - 2 * F);
        tl.set("#m-r6", { opacity: 1 }, 1.9);

        // Discrete typing sequences
        function build(start, text, base, step, mod, pauseAt, pause) {
          var seq = [{ t: 0, text: "" }], t = start;
          for (var i = 1; i <= text.length; i++) {
            seq.push({ t: t, text: text.slice(0, i) });
            t += base + step * ((i * 7) % mod);
            if (i === pauseAt) t += pause;
          }
          return { seq: seq, end: seq[seq.length - 1].t };
        }
        var S1 = build(0.45, "lit_list-components", 0.014, 0.009, 3, 4, 0.05);
        var S6 = build(1.9, "lit_recent-events", 0.006, 0.008, 3, 4, 0.0);
        function textAt(seq, time) {
          for (var i = seq.length - 1; i >= 0; i--) if (time >= seq[i].t) return seq[i].text;
          return "";
        }
        function blink(time, from) { return Math.sin((time - from) * Math.PI * 2 / 0.6) > 0 ? "1" : "0"; }
        function render(t) {
          $("m-t1").textContent = textAt(S1.seq, t);
          $("m-t6").textContent = textAt(S6.seq, t);
          var c1 = "0";
          if (t >= 0.4 && t < 1.0) c1 = t < S1.end + 0.05 ? "1" : blink(t, S1.end + 0.05);
          var c6 = "0";
          if (t >= 1.9 && t < 2.35) c6 = t < S6.end + 0.05 ? "1" : blink(t, S6.end + 0.05);
          $("m-c1").style.opacity = c1;
          $("m-c6").style.opacity = c6;
        }
        var drv = { t: 0 };
        tl.to(drv, { t: 2.5, duration: 2.5, ease: "none", onUpdate: function () { render(drv.t); } }, 0);
        render(0);

        // Scene 4: snap shut toward the ruler (y 620) by 2.35
        tl.to("#m-content", { scaleY: 0, duration: 0.2, ease: "power3.in" }, 2.15);
        tl.to("#m-conn", { scaleY: 0, duration: 0.2, ease: "power3.in" }, 2.15);
        tl.set("#m-content", { opacity: 0 }, 2.35);
