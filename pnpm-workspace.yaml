packages:
  - docs
  - playground
  - examples/flame
  - examples/web-awesome
  - examples/fernhouse
# The playground and the examples name the plugin with a plain range, not
# `workspace:*`, so StackBlitz's `npm install` can read it; this still links
# the local copy.
linkWorkspacePackages: true
# playground/package.json repeats vite and vite-plus as plain versions (npm on
# StackBlitz cannot read `catalog:`); bump them there too.
# It also pins rolldown to the version vite-plus-core bundles (its
# `bundledVersions`): on WebContainer the bundled binding looks up
# `rolldown/package.json` to pick the wasm build, and fails without it.
# src/test/unit/playground-pins_test.ts fails when any of the three drift.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: 'catalog:'
  # Except for the examples, which are plain Vite projects: their `dev`
  # scripts run `vite`, and vite-plus-core has no such bin. Keep these in step
  # with each example's package.json.
  vite-plugin-lit-flame-example>vite: ^8.3.2
  vite-plugin-lit-web-awesome-example>vite: ^8.3.2
  vite-plugin-lit-fernhouse-example>vite: ^8.3.2
  # satori pins 0.7.3, inside GHSA-px8p-9vwx-vf98 (an infinite loop in
  # `unzipSync`). It only calls `inflateSync`, so this is for a clean audit,
  # and a patch release can't break it. Drop it once satori moves on.
  fflate@<0.7.5: ^0.7.5
  # vite-plugin-inspect 12 (the latest) still asks for devtools-kit ^0.4,
  # which drags in a second devframe stack (0.8.2) next to ours (1.x). The
  # 0.7 kit it gets instead is checked by loading /__inspect/ in the playground.
  vite-plugin-inspect>@vitejs/devtools-kit: ^0.7.6
  # Exact patch pins (satteri's wasm build, @testing-library/dom, vitest)
  # that would each keep a second copy one patch behind.
  '@emnapi/core': ^1.11.3
  '@emnapi/runtime': ^1.11.3
  aria-query: ^5.3.2
  tinyexec: ^1.3.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  # astro bundles with esbuild; its postinstall wires up the platform binary.
  esbuild: true
minimumReleaseAgeExclude:
  - vite@8.3.2
